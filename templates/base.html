<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ отзывов | Интернет-магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shop"></i> Анализ отзывов
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house"></i> Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/stats"><i class="bi bi-bar-chart"></i> Статистика</a></li>
                    <li class="nav-item"><a class="nav-link" href="/models"><i class="bi bi-graph-up"></i> Модели</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clusters"><i class="bi bi-diagram-3"></i> Кластеры</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-journal-text"></i> Логи</a></li>
                </ul>
                <span class="navbar-text ms-3 text-muted small">
                    <i class="bi bi-person-badge"></i> ID: {{ user_id[:8] }}
                </span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer mt-5 py-3 bg-light">
        <div class="container text-center text-muted small">
            &copy; 2025 Финальная работа — Анализ отзывов интернет-магазина (Grade 5)
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script>
        function showNotification(message, type) {
            const div = document.createElement('div');
            div.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3`;
            div.style.zIndex = '9999';
            div.innerHTML = `${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 5000);
        }
    </script>
</body>
</html>
